<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador Inteligente de Remitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: 'VWHead';
            src: url('/assets/VWHeadBold.otf') format('opentype');
            font-weight: 700;
        }
        @font-face {
            font-family: 'VWText';
            src: url('/assets/VWTextRegular.otf') format('opentype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'VWText';
            src: url('/assets/VWTextBold.otf') format('opentype');
            font-weight: 700;
        }

        :root {
            --bg: #F2F5F9;
            --surface: #FFFFFF;
            --surface-2: #F7F9FC;
            --border: #E3E8F0;
            --text: #16233B;
            --text-muted: #6B7A94;
            --primary: #004D98;
            --primary-dark: #003A73;
            --primary-soft: #E9F1FB;
            --green: #1F9D55;
            --green-soft: #E8F7EE;
            --red: #E03131;
            --red-soft: #FDEAEA;
            --amber: #E8850C;
            --amber-soft: #FFF2DF;
            --sidebar-bg: #0B1B33;
            --sidebar-line: #17294A;
            --sidebar-text: #8CA2C4;
            --shadow: 0 1px 3px rgba(16,32,62,.06), 0 8px 24px rgba(16,32,62,.06);
            --shadow-soft: 0 1px 2px rgba(16,32,62,.05);
            --radius: 14px;
            --mono: 'Consolas', 'Courier New', monospace;
        }

        [data-theme="dark"] {
            --bg: #0D1526;
            --surface: #16223A;
            --surface-2: #1B2944;
            --border: #23345A;
            --text: #E7EDF7;
            --text-muted: #93A5C4;
            --primary-soft: #16304F;
            --green-soft: #123420;
            --red-soft: #3A1717;
            --amber-soft: #3A2A10;
            --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
            --shadow-soft: 0 1px 2px rgba(0,0,0,.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'VWText', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            overflow-x: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
            width: 250px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            transition: width .25s ease;
            overflow: hidden;
        }
        .sidebar.collapsed { width: 68px; }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 2px 6px 18px;
            border-bottom: 1px solid var(--sidebar-line);
            margin-bottom: 18px;
            white-space: nowrap;
        }
        .sidebar-brand .vw-icon {
            width: 46px; height: 46px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px rgba(255,255,255,.08), 0 4px 14px rgba(0,0,0,.4);
        }
        .sidebar-brand .vw-icon img { width: 100%; height: 100%; object-fit: contain; }
        .sidebar-brand .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .sidebar-brand .brand-text .title {
            font-family: 'VWHead', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .sidebar-brand .brand-text .sub { font-size: 11px; color: var(--sidebar-text); letter-spacing: 2px; }

        .sidebar-nav { display: flex; flex-direction: column; gap: 6px; }
        .sidebar .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--sidebar-text);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 13.5px;
            font-weight: 500;
            white-space: nowrap;
            transition: all .18s ease;
        }
        .sidebar .nav-link .nav-ico {
            width: 22px; height: 22px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .sidebar .nav-link:hover { background: rgba(255,255,255,.06); color: #fff; }
        .sidebar .nav-link.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 8px 20px rgba(0,77,152,.4);
        }
        .sidebar .nav-link.active::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 9px solid var(--primary);
        }

        /* Arte decorativo (silueta auto/tecnología) */
        .sidebar-art {
            margin-top: auto;
            opacity: .55;
            padding: 0 4px;
        }
        .sidebar-art svg { width: 100%; height: auto; }

        .sidebar-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            padding: 14px 6px 0;
            border-top: 1px solid var(--sidebar-line);
            white-space: nowrap;
        }
        .sidebar-footer .org {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        .sidebar-footer .org .org-ico {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            display: flex; align-items: center; justify-content: center;
            color: var(--sidebar-text);
            font-size: 13px;
            flex-shrink: 0;
        }
        .sidebar-footer .org .org-name { font-size: 12px; color: var(--sidebar-text); }
        .sidebar-footer .collapse-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,.08);
            color: var(--sidebar-text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all .2s ease;
        }
        .sidebar-footer .collapse-btn:hover { background: var(--primary); color: #fff; }
        .sidebar-footer .collapse-btn i { transition: transform .25s ease; }

        /* Sidebar colapsado */
        .sidebar.collapsed .brand-text,
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed .org-name,
        .sidebar.collapsed .sidebar-art { display: none; }
        .sidebar.collapsed .sidebar-brand { justify-content: center; padding: 2px 0 18px; }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 13px; }
        .sidebar.collapsed .nav-link.active::after { right: -10px; }
        .sidebar.collapsed .sidebar-footer { justify-content: center; }
        .sidebar.collapsed .collapse-btn i { transform: rotate(180deg); }

        /* ===== MAIN ===== */
        main {
            margin-left: 250px;
            padding: 22px 26px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: margin-left .25s ease;
        }
        .sidebar.collapsed ~ main { margin-left: 68px; }

        /* ===== HEADER ===== */
        .main-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }
        .main-header .title-group { display: flex; align-items: center; gap: 14px; }
        .main-header .title-ico {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: var(--primary-soft);
            color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .main-header h1 {
            font-family: 'VWHead', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            color: var(--text);
            letter-spacing: .5px;
        }
        .main-header .subtitle { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
        .main-header .header-actions { display: flex; align-items: center; gap: 10px; }
        .main-header .icon-btn {
            position: relative;
            width: 40px; height: 40px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            box-shadow: var(--shadow-soft);
            transition: all .18s ease;
        }
        .main-header .icon-btn:hover { color: var(--primary); border-color: var(--primary); transform: translateY(-1px); }

        /* ===== ACCIONES ===== */
        .acciones {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            flex-shrink: 0;
        }
        .action-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow);
            cursor: pointer;
            text-align: left;
            color: var(--text);
            transition: all .18s ease;
            min-width: 0;
        }
        .action-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(16,32,62,.12); }
        .action-card.neutro { cursor: default; }
        .action-card.neutro:hover { transform: none; }
        .action-card .action-ico {
            width: 44px; height: 44px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px;
            flex-shrink: 0;
        }
        .action-card .action-text { display: flex; flex-direction: column; min-width: 0; }
        .action-card .action-text b {
            font-family: 'VWHead', sans-serif;
            font-size: 13px;
            letter-spacing: .4px;
            white-space: nowrap;
        }
        .action-card .action-text small { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .action-card.azul .action-ico { background: var(--primary-soft); color: var(--primary); }
        .action-card.azul:hover { border-color: var(--primary); }
        .action-card.rojo .action-ico { background: var(--red-soft); color: var(--red); }
        .action-card.rojo:hover { border-color: var(--red); }
        .action-card.amarillo .action-ico { background: var(--amber-soft); color: var(--amber); }
        .action-card.amarillo:hover { border-color: var(--amber); }
        .action-card.verde .action-ico { background: var(--green-soft); color: var(--green); }
        .action-card.verde:hover { border-color: var(--green); }
        .action-card.neutro .action-ico { background: var(--surface-2); color: var(--text-muted); }

        /* ===== CARDS GENÉRICAS ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ===== DATOS REMITO ===== */
        .card-remito {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.6fr 1fr;
            gap: 16px 24px;
            padding: 18px 22px;
            align-items: stretch;
            flex-shrink: 0;
        }
        .card-remito .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
        .card-remito .field label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
        }
        .card-remito .field label i { font-size: 11px; color: var(--primary); }
        .card-remito .field .value {
            display: flex; align-items: center; gap: 8px;
            min-width: 0;
        }
        .card-remito .field .value span {
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            border-left: 3px solid var(--primary);
            padding-left: 9px;
        }
        .card-remito .copy-mini {
            border: none; background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            opacity: 0;
            transition: opacity .15s ease, color .15s ease;
            padding: 2px;
        }
        .card-remito .field:hover .copy-mini { opacity: 1; }
        .card-remito .copy-mini:hover { color: var(--primary); }

        /* ===== TABLA ===== */
        .card-tabla {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }
        .table-scroll { flex: 1; overflow: auto; }
        .table-scroll table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 13px;
        }
        .table-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #0B1B33;
            color: #B9C9E2;
            font-family: 'VWHead', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 12px 14px;
            text-align: left;
            white-space: nowrap;
        }
        .table-scroll thead th.col-index { width: 56px; text-align: center; }
        .table-scroll thead th.col-codigo { width: 30%; }
        .table-scroll thead th.col-descripcion { width: 38%; }
        .table-scroll thead th.col-cantidad { width: 8%; text-align: center; }
        .table-scroll thead th.col-precio { width: 24%; text-align: right; }

        .table-scroll tbody td {
            padding: 9px 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            cursor: pointer;
            transition: background .12s ease;
        }
        .table-scroll tbody tr { transition: background .12s ease; }
        .table-scroll tbody tr:hover { background: var(--surface-2); }
        .table-scroll tbody tr.row-selected td { background: var(--primary-soft); }

        .index-cell { text-align: center; }
        .row-num {
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: var(--primary-soft);
            color: var(--primary);
            font-family: 'VWHead', sans-serif;
            font-size: 12px;
            font-weight: 700;
        }
        .codigo-cell {
            font-family: var(--mono);
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .codigo-cell .codigo-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .desc-cell { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cant-cell { text-align: center; color: var(--text-muted); }
        .precio-cell {
            text-align: right;
            font-family: var(--mono);
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }
        .cell-copy {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: all .15s ease;
            padding: 2px;
            flex-shrink: 0;
        }
        td:hover .cell-copy { opacity: 1; }
        .cell-copy:hover { color: var(--primary); transform: scale(1.15); }

        .table-scroll tbody td.cell-selected {
            background: var(--primary) !important;
            color: #fff !important;
            border-radius: 6px;
        }
        .table-scroll tbody td.cell-selected .row-num,
        .table-scroll tbody td.cell-selected .cell-copy,
        .table-scroll tbody td.cell-selected i { color: #fff !important; background: transparent; }
        .table-scroll tbody td.cell-selected .row-num { background: rgba(255,255,255,.2); }

        .table-scroll .empty {
            padding: 40px 14px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }
        .table-scroll .empty i { margin-right: 6px; color: var(--primary); }

        /* ===== FOOTER / RESUMEN ===== */
        .footer-resumen {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            padding: 16px 20px;
            flex-shrink: 0;
        }
        .resumen-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            min-width: 0;
        }
        .resumen-item .res-ico {
            width: 42px; height: 42px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }
        .resumen-item .res-body { display: flex; flex-direction: column; min-width: 0; }
        .resumen-item .res-body label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .resumen-item .res-body b {
            font-family: var(--mono);
            font-size: 19px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .resumen-item .res-body small { font-size: 11px; color: var(--text-muted); }
        .resumen-item.repuestos .res-ico { background: var(--amber-soft); color: var(--amber); }
        .resumen-item.siniva { position: relative; overflow: hidden; }
        .resumen-item.siniva .res-ico { background: var(--primary-soft); color: var(--primary); }
        .resumen-item.siniva .res-body b { color: var(--primary); }
        .resumen-item.coniva .res-ico { background: var(--green-soft); color: var(--green); }
        .resumen-item.coniva .res-body b { color: var(--green); }

        /* mini barras decorativas (discretas) */
        .mini-bars {
            position: absolute;
            right: 16px; bottom: 14px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            opacity: .5;
        }
        .mini-bars span {
            width: 5px;
            border-radius: 2px;
            background: var(--primary);
            display: block;
        }
        .mini-bars span:nth-child(1) { height: 10px; }
        .mini-bars span:nth-child(2) { height: 16px; }
        .mini-bars span:nth-child(3) { height: 22px; }
        .mini-bars span:nth-child(4) { height: 14px; }

        /* ===== TOOLTIP ===== */
        .copy-tooltip {
            position: fixed;
            top: 18px; right: 20px;
            background: #16233B;
            color: #fff;
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
            pointer-events: none;
            z-index: 9999;
            animation: slideIn .25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1400px) {
            .card-remito { grid-template-columns: 1fr 1fr 1fr; }
            .card-remito .field.wide { grid-column: span 3; }
        }
        @media (max-width: 1100px) {
            .acciones { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .sidebar { width: 68px; }
            .sidebar .brand-text, .sidebar .nav-label, .sidebar .org-name, .sidebar .sidebar-art { display: none; }
            .sidebar-brand { justify-content: center; }
            .sidebar .nav-link { justify-content: center; padding: 13px; }
            .sidebar-footer { justify-content: center; }
            main { margin-left: 68px; padding: 14px; }
            .acciones { grid-template-columns: 1fr 1fr; }
            .footer-resumen { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="vw-icon"><img src="/assets/vw_logo.png" alt="VW"></div>
            <div class="brand-text">
                <span class="title">VERIFICADOR</span>
                <span class="sub">v3.0</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a class="nav-link active" href="/">
                <span class="nav-ico"><i class="fas fa-file-alt"></i></span>
                <span class="nav-label">Nuevo Remito</span>
            </a>
            <a class="nav-link" href="/verificar">
                <span class="nav-ico"><i class="fas fa-shield-alt"></i></span>
                <span class="nav-label">Verificar</span>
            </a>
        </nav>

        <div class="sidebar-art">
            <svg viewBox="0 0 220 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 70 L70 70 L85 44 L130 44 L152 70 L210 70" stroke="#2E4A7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M90 44 L100 28 L150 28 L160 44" stroke="#2E4A7A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="62" cy="70" r="7" stroke="#2E4A7A" stroke-width="3"/>
                <circle cx="200" cy="70" r="7" stroke="#2E4A7A" stroke-width="3"/>
                <circle cx="62" cy="70" r="2.5" fill="#2E4A7A"/>
                <circle cx="200" cy="70" r="2.5" fill="#2E4A7A"/>
                <path d="M120 28 L150 28" stroke="#2E4A7A" stroke-width="3" stroke-linecap="round"/>
                <path d="M128 36 L142 36" stroke="#2E4A7A" stroke-width="3" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="sidebar-footer">
            <div class="org">
                <span class="org-ico"><i class="fas fa-user"></i></span>
                <span class="org-name">Volkswagen Org Sur</span>
            </div>
            <button class="collapse-btn" onclick="toggleSidebar()" title="Contraer barra">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
    </aside>

    <main>
        <!-- HEADER -->
        <header class="main-header">
            <div class="title-group">
                <div class="title-ico"><i class="fas fa-file-invoice"></i></div>
                <div>
                    <h1>Nuevo Remito</h1>
                    <p class="subtitle">Documento · Cargá y gestioná la información del remito</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Modo oscuro / claro">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- ACCIONES -->
        <section class="acciones">
            <button class="action-card azul" onclick="document.getElementById('fileInput').click()">
                <span class="action-ico"><i class="fas fa-file-pdf"></i></span>
                <span class="action-text"><b>CARGAR PDF</b><small>Seleccionar archivo</small></span>
            </button>
            <button class="action-card rojo" onclick="limpiarDatos()">
                <span class="action-ico"><i class="fas fa-trash"></i></span>
                <span class="action-text"><b>LIMPIAR</b><small>Borrar todo</small></span>
            </button>
            <button class="action-card amarillo" onclick="editarDatos()">
                <span class="action-ico"><i class="fas fa-database"></i></span>
                <span class="action-text"><b>DATOS</b><small>Ver / editar datos</small></span>
            </button>
            <button class="action-card verde" onclick="copiarRepuestosYPrecios()">
                <span class="action-ico"><i class="fas fa-copy"></i></span>
                <span class="action-text"><b>COPIAR TODO</b><small>Copiar al portapapeles</small></span>
            </button>
            <div class="action-card neutro">
                <span class="action-ico"><i class="fas fa-arrows-left-right"></i></span>
                <span class="action-text"><b>FLECHAS | CLICK COPIA</b><small>Flechas navegan · Doble click edita</small></span>
            </div>
        </section>

        <input type="file" id="fileInput" accept=".pdf" style="display:none" onchange="procesarPDF(this)">

        <!-- DATOS REMITO -->
        <section class="card card-remito">
            <div class="field">
                <label><i class="fas fa-file-invoice"></i> Remito</label>
                <div class="value">
                    <span id="remitoDisplay">-</span>
                    <button class="copy-mini" data-copy="remitoDisplay" title="Copiar"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <div class="field">
                <label><i class="fas fa-clipboard-list"></i> Orden</label>
                <div class="value">
                    <span id="ordenDisplay">-</span>
                    <button class="copy-mini" data-copy="ordenDisplay" title="Copiar"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <div class="field">
                <label><i class="fas fa-shield-halved"></i> Siniestro</label>
                <div class="value">
                    <span id="siniestroDisplay">-</span>
                    <button class="copy-mini" data-copy="siniestroDisplay" title="Copiar"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <div class="field wide">
                <label><i class="fas fa-car"></i> Modelo</label>
                <div class="value">
                    <span id="modeloDisplay">-</span>
                    <button class="copy-mini" data-copy="modeloDisplay" title="Copiar"><i class="fas fa-copy"></i></button>
                </div>
            </div>
            <div class="field">
                <label><i class="fas fa-id-card"></i> Patente</label>
                <div class="value">
                    <span id="patenteDisplay">-</span>
                    <button class="copy-mini" data-copy="patenteDisplay" title="Copiar"><i class="fas fa-copy"></i></button>
                </div>
            </div>
        </section>

        <!-- TABLA -->
        <section class="card card-tabla">
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th class="col-index">#</th>
                            <th class="col-codigo">Código</th>
                            <th class="col-descripcion">Descripción</th>
                            <th class="col-cantidad">Cant.</th>
                            <th class="col-precio">S/IVA</th>
                        </tr>
                    </thead>
                    <tbody id="repuestosBody">
                        <tr>
                            <td colspan="5" class="empty"><i class="fas fa-file-pdf"></i> Cargá un PDF para ver los repuestos</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- FOOTER / RESUMEN -->
        <footer class="card footer-resumen">
            <div class="resumen-item repuestos">
                <span class="res-ico"><i class="fas fa-boxes"></i></span>
                <div class="res-body">
                    <b id="repuestosCount">0</b>
                    <small>items cargados</small>
                </div>
            </div>
            <div class="resumen-item siniva">
                <span class="res-ico"><i class="fas fa-file-invoice-dollar"></i></span>
                <div class="res-body">
                    <label>Total s/IVA</label>
                    <b id="totalSinIva">$0.00</b>
                </div>
                <div class="mini-bars"><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="resumen-item coniva">
                <span class="res-ico"><i class="fas fa-check-circle"></i></span>
                <div class="res-body">
                    <label>Total c/IVA</label>
                    <b id="totalConIva">$0.00</b>
                </div>
            </div>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        /* ===== SIDEBAR ===== */
        function toggleSidebar() {
            const sb = document.querySelector('.sidebar');
            sb.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sb.classList.contains('collapsed'));
        }
        if (localStorage.getItem('sidebarCollapsed') === 'true') {
            document.querySelector('.sidebar').classList.add('collapsed');
        }

        /* ===== TEMA OSCURO / CLARO ===== */
        function toggleTheme() {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
            localStorage.setItem('theme', dark ? 'light' : 'dark');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const dark = document.documentElement.getAttribute('data-theme') === 'dark';
            const btn = document.getElementById('themeToggle');
            if (btn) btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        updateThemeIcon();

        /* ===== ESTADO ===== */
        let datosPdf = {};
        let repuestosData = [];
        let celdaSeleccionada = null;
        let filaSeleccionada = null;

        /* ===== COPIAR DESDE LOS CAMPOS DEL REMITO ===== */
        document.querySelectorAll('.copy-mini').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.copy;
                const el = document.getElementById(id);
                if (el && el.textContent && el.textContent !== '-') {
                    copiarTexto(el.textContent, 'Copiado: ' + el.textContent);
                }
            });
        });

        /* ============ CÓDIGOS SE MUESTRAN COMO VIENEN ============ */
        function formatearCodigo(codigo) {
            if (!codigo) return codigo;
            let limpio = codigo.trim().toUpperCase();
            limpio = limpio.replace(/--\d{2}-\d{2}-\d{4}$/, '');
            limpio = limpio.replace(/-\d{2}-\d{2}-\d{4}$/, '');
            limpio = limpio.replace(/-{2,}/g, '-');
            limpio = limpio.replace(/-+$/, '');
            return limpio;
        }

        /* ===== PROCESAR PDF ===== */
        function procesarPDF(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            fetch('/api/cargar_pdf', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                Swal.close();
                if (data.error) { Swal.fire('Error', data.error, 'error'); return; }

                datosPdf = data.datos;
                document.getElementById('remitoDisplay').textContent = data.datos.remito || '-';
                document.getElementById('ordenDisplay').textContent = data.datos.orden || '-';
                document.getElementById('siniestroDisplay').textContent = data.datos.siniestro || '-';
                document.getElementById('modeloDisplay').textContent = data.datos.modelo || '-';
                document.getElementById('patenteDisplay').textContent = data.datos.patente || '-';

                const repuestosFormateados = data.repuestos.map(rep => {
                    const codigo = formatearCodigo(rep.codigo || '');
                    const precioSinIva = rep.precio_sin_iva || 0;
                    return {
                        ...rep,
                        codigo: codigo,
                        precio_sin_iva: precioSinIva,
                        precio_con_iva: precioSinIva * 1.21
                    };
                });

                repuestosData = repuestosFormateados;
                actualizarTabla(repuestosFormateados);
                actualizarResumen(repuestosFormateados);

                Swal.fire({ icon: 'success', title: 'PDF cargado', text: `${repuestosFormateados.length} repuestos`, timer: 1200, showConfirmButton: false });
            })
            .catch(error => { Swal.close(); Swal.fire('Error', 'Error al procesar el PDF', 'error'); });

            input.value = '';
        }

        /* ===== TABLA ===== */
        function actualizarTabla(repuestos) {
            const tbody = document.getElementById('repuestosBody');
            tbody.innerHTML = '';
            document.getElementById('repuestosCount').textContent = repuestos.length;

            if (!repuestos || repuestos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty"><i class="fas fa-file-pdf"></i> Cargá un PDF para ver los repuestos</td></tr>`;
                return;
            }

            repuestos.forEach((rep, index) => {
                const tr = document.createElement('tr');
                tr.dataset.index = index;
                tr.setAttribute('tabindex', '0');

                const precioSin = (rep.precio_sin_iva || 0);

                tr.dataset.codigo = rep.codigo || '';
                tr.dataset.precioSin = precioSin.toFixed(2);
                tr.dataset.descripcion = rep.descripcion || '';
                tr.dataset.cantidad = rep.cantidad || '1';

                tr.innerHTML = `
                    <td class="index-cell"><span class="row-num">${index + 1}</span></td>
                    <td class="codigo-cell" data-col="1" title="${rep.codigo || ''}">
                        <span class="codigo-text">${rep.codigo || ''}</span>
                        <button class="cell-copy" data-copy="${rep.codigo || ''}" title="Copiar código"><i class="fas fa-copy"></i></button>
                    </td>
                    <td class="desc-cell" data-col="2" title="${rep.descripcion || ''}">${rep.descripcion || ''}</td>
                    <td class="cant-cell" data-col="3">${rep.cantidad || '1'}</td>
                    <td class="precio-cell" data-col="4">$${precioSin.toFixed(2)}<button class="cell-copy" data-copy="${precioSin.toFixed(2)}" title="Copiar precio"><i class="fas fa-copy"></i></button></td>
                `;

                tr.querySelectorAll('.cell-copy').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        copiarTexto(this.dataset.copy, 'Copiado: ' + this.dataset.copy);
                    });
                });

                tr.querySelectorAll('td[data-col]').forEach(td => {
                    td.addEventListener('click', function(e) {
                        const col = parseInt(this.dataset.col) || 1;
                        seleccionarCelda(this, col);
                        copiarDesdeCelda(this);
                    });

                    td.addEventListener('dblclick', function(e) {
                        e.stopPropagation();
                        const col = parseInt(this.dataset.col) || 1;
                        if (col === 1) {
                            editarCodigoEnFila(this);
                        } else {
                            const tr = this.closest('tr');
                            const texto = `${tr.dataset.codigo} | s/IVA: $${tr.dataset.precioSin}`;
                            copiarTexto(texto, 'Repuesto copiado');
                        }
                    });
                });

                tbody.appendChild(tr);
            });

            const primeraFila = tbody.firstChild;
            if (primeraFila) {
                const primeraCelda = primeraFila.querySelector('td[data-col="1"]') || primeraFila.querySelector('td[data-col]');
                if (primeraCelda) seleccionarCelda(primeraCelda, 1);
            }
        }

        function seleccionarCelda(td, col) {
            if (celdaSeleccionada) celdaSeleccionada.classList.remove('cell-selected');
            if (filaSeleccionada) filaSeleccionada.classList.remove('row-selected');

            td.classList.add('cell-selected');
            const tr = td.closest('tr');
            if (tr) {
                tr.classList.add('row-selected');
                filaSeleccionada = tr;
                celdaSeleccionada = td;
                td.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function copiarDesdeCelda(td) {
            const tr = td.closest('tr');
            if (!tr) return;
            const col = parseInt(td.dataset.col) || 1;
            let texto = '', mensaje = '';

            switch(col) {
                case 1: texto = tr.dataset.codigo; mensaje = 'Código: ' + texto; break;
                case 2: texto = tr.dataset.descripcion || ''; mensaje = 'Descripción: ' + texto; break;
                case 3: texto = tr.dataset.cantidad || '1'; mensaje = 'Cantidad: ' + texto; break;
                case 4: texto = '$' + tr.dataset.precioSin; mensaje = 'Precio s/IVA: ' + texto; break;
                default: texto = tr.dataset.codigo; mensaje = 'Código: ' + texto;
            }
            if (texto) copiarTexto(texto, mensaje);
        }

        /* ===== EDITAR CÓDIGO DE PIEZA (doble click) ===== */
        function editarCodigoEnFila(td) {
            const tr = td.closest('tr');
            if (!tr) return;
            const index = parseInt(tr.dataset.index);
            if (isNaN(index) || !repuestosData[index]) return;

            Swal.fire({
                title: 'Editar código de pieza',
                input: 'text',
                inputLabel: 'Código',
                inputValue: repuestosData[index].codigo || '',
                width: 460,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                inputValidator: (v) => {
                    if (!v || !v.trim()) return 'El código no puede estar vacío';
                }
            }).then(result => {
                if (!result.isConfirmed) return;
                const nuevo = formatearCodigo(result.value.trim().toUpperCase());
                repuestosData[index].codigo = nuevo;
                tr.dataset.codigo = nuevo;
                const textoEl = tr.querySelector('.codigo-text');
                if (textoEl) {
                    textoEl.textContent = nuevo;
                    textoEl.title = nuevo;
                }
                const copyBtn = tr.querySelector('.cell-copy[title="Copiar código"]');
                if (copyBtn) copyBtn.dataset.copy = nuevo;
                actualizarResumen(repuestosData);
                mostrarNotificacion('Código actualizado: ' + nuevo);
            });
        }

        /* ============ NAVEGACIÓN CON TECLADO ============ */
        document.addEventListener('keydown', function(e) {
            const tbody = document.getElementById('repuestosBody');
            const filas = tbody.querySelectorAll('tr');
            if (filas.length === 0 || filas[0].querySelector('td[colspan]')) return;

            let filaActual = null;
            let colActual = 0;

            if (celdaSeleccionada) {
                filaActual = celdaSeleccionada.closest('tr');
                colActual = parseInt(celdaSeleccionada.dataset.col) || 1;
            } else {
                filaActual = filas[0];
                colActual = 1;
            }

            let nuevaFila = filaActual;
            let nuevaCol = colActual;
            let movio = false;

            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (filaActual.nextElementSibling) { nuevaFila = filaActual.nextElementSibling; movio = true; }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (filaActual.previousElementSibling) { nuevaFila = filaActual.previousElementSibling; movio = true; }
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    if (colActual < 4) { nuevaCol = colActual + 1; movio = true; }
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    if (colActual > 1) { nuevaCol = colActual - 1; movio = true; }
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (celdaSeleccionada) copiarDesdeCelda(celdaSeleccionada);
                    return;
                case 'c':
                    if (e.ctrlKey) {
                        e.preventDefault();
                        if (celdaSeleccionada) copiarDesdeCelda(celdaSeleccionada);
                    }
                    return;
            }

            if (movio) {
                const celdas = nuevaFila.querySelectorAll('td');
                let celdaEncontrada = null;
                for (let td of celdas) {
                    if (parseInt(td.dataset.col) === nuevaCol) { celdaEncontrada = td; break; }
                }
                if (!celdaEncontrada && celdas.length > 0) {
                    celdaEncontrada = celdas[0];
                    if (celdaEncontrada.dataset.col === '0') celdaEncontrada = celdas[1] || celdas[0];
                }
                if (celdaEncontrada) seleccionarCelda(celdaEncontrada, parseInt(celdaEncontrada.dataset.col) || 1);
            }
        });

        /* ===== RESUMEN ===== */
        function actualizarResumen(repuestos) {
            let totalSinIva = 0, totalConIva = 0;
            repuestos.forEach(rep => {
                const precio = rep.precio_sin_iva || 0;
                const cantidad = parseFloat(rep.cantidad) || 1;
                totalSinIva += precio * cantidad;
                totalConIva += (precio * 1.21) * cantidad;
            });
            document.getElementById('totalSinIva').textContent = '$' + totalSinIva.toFixed(2);
            document.getElementById('totalConIva').textContent = '$' + totalConIva.toFixed(2);
        }

        /* ===== COPIAR TEXTO ===== */
        async function copiarTexto(texto, mensaje) {
            try {
                await navigator.clipboard.writeText(texto);
                if (mensaje) mostrarNotificacion(mensaje);
            } catch {
                const ta = document.createElement('textarea');
                ta.value = texto;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                if (mensaje) mostrarNotificacion(mensaje);
            }
        }

        function mostrarNotificacion(mensaje) {
            const div = document.createElement('div');
            div.className = 'copy-tooltip';
            div.textContent = '✅ ' + mensaje;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.4s';
                setTimeout(() => div.remove(), 400);
            }, 1400);
        }

        /* ===== ACCIONES ===== */
        function limpiarDatos() {
            ['remitoDisplay','ordenDisplay','siniestroDisplay','modeloDisplay','patenteDisplay'].forEach(id => {
                document.getElementById(id).textContent = '-';
            });
            document.getElementById('repuestosBody').innerHTML = `<tr><td colspan="5" class="empty"><i class="fas fa-file-pdf"></i> Cargá un PDF para ver los repuestos</td></tr>`;
            document.getElementById('repuestosCount').textContent = '0';
            document.getElementById('totalSinIva').textContent = '$0.00';
            document.getElementById('totalConIva').textContent = '$0.00';
            datosPdf = {};
            repuestosData = [];
            celdaSeleccionada = null;
            filaSeleccionada = null;
        }

        function escapeAttr(s) {
            return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function editarDatos() {
            const get = id => document.getElementById(id).textContent === '-' ? '' : document.getElementById(id).textContent;
            const html = `
                <div style="text-align:left;display:grid;gap:6px;">
                    <label style="font-size:11px;font-weight:700;color:#6B7A94;text-transform:uppercase;margin:0;">Remito</label>
                    <input id="editRemito" class="swal2-input" style="margin:0;" value="${escapeAttr(get('remitoDisplay'))}">
                    <label style="font-size:11px;font-weight:700;color:#6B7A94;text-transform:uppercase;margin:0;">Orden</label>
                    <input id="editOrden" class="swal2-input" style="margin:0;" value="${escapeAttr(get('ordenDisplay'))}">
                    <label style="font-size:11px;font-weight:700;color:#6B7A94;text-transform:uppercase;margin:0;">Siniestro</label>
                    <input id="editSiniestro" class="swal2-input" style="margin:0;" value="${escapeAttr(get('siniestroDisplay'))}">
                    <label style="font-size:11px;font-weight:700;color:#6B7A94;text-transform:uppercase;margin:0;">Modelo</label>
                    <input id="editModelo" class="swal2-input" style="margin:0;" value="${escapeAttr(get('modeloDisplay'))}">
                    <label style="font-size:11px;font-weight:700;color:#6B7A94;text-transform:uppercase;margin:0;">Patente</label>
                    <input id="editPatente" class="swal2-input" style="margin:0;" value="${escapeAttr(get('patenteDisplay'))}">
                    <button id="btnCopiarDatos" type="button" style="margin-top:8px;padding:9px;border:none;border-radius:8px;background:#E9F1FB;color:#004D98;font-weight:700;cursor:pointer;">
                        <i class="fas fa-copy"></i> Copiar datos al portapapeles
                    </button>
                </div>`;
            Swal.fire({
                title: 'Editar datos del remito',
                html: html,
                width: 500,
                showCancelButton: true,
                confirmButtonText: 'Guardar',
                cancelButtonText: 'Cancelar',
                didOpen: () => {
                    document.getElementById('btnCopiarDatos').addEventListener('click', () => {
                        const leer = id => document.getElementById(id).value.trim() || '-';
                        const texto = `REMITO: ${leer('editRemito')}\nORDEN: ${leer('editOrden')}\nSINIESTRO: ${leer('editSiniestro')}\nMODELO: ${leer('editModelo')}\nPATENTE: ${leer('editPatente')}`;
                        copiarTexto(texto, 'Datos copiados');
                    });
                },
                preConfirm: () => ({
                    remito: document.getElementById('editRemito').value.trim(),
                    orden: document.getElementById('editOrden').value.trim(),
                    siniestro: document.getElementById('editSiniestro').value.trim(),
                    modelo: document.getElementById('editModelo').value.trim(),
                    patente: document.getElementById('editPatente').value.trim()
                })
            }).then(result => {
                if (!result.isConfirmed) return;
                const v = result.value;
                const map = { remitoDisplay: 'remito', ordenDisplay: 'orden', siniestroDisplay: 'siniestro', modeloDisplay: 'modelo', patenteDisplay: 'patente' };
                Object.keys(map).forEach(id => {
                    document.getElementById(id).textContent = v[map[id]] || '-';
                    if (datosPdf) datosPdf[map[id]] = v[map[id]];
                });
                mostrarNotificacion('Datos actualizados');
            });
        }

        async function copiarRepuestosYPrecios() {
            if (repuestosData.length === 0) {
                Swal.fire('Info', 'No hay repuestos', 'info');
                return;
            }
            let texto = 'CÓDIGO | CANT. | s/IVA\n' + '='.repeat(50) + '\n';
            repuestosData.forEach(rep => {
                texto += `${rep.codigo || ''} | ${rep.cantidad || '1'} | $${(rep.precio_sin_iva||0).toFixed(2)}\n`;
            });
            texto += '\n' + '='.repeat(50) + '\n';
            texto += `TOTAL s/IVA: ${document.getElementById('totalSinIva').textContent}  |  c/IVA: ${document.getElementById('totalConIva').textContent}\n`;
            texto += `Repuestos: ${repuestosData.length}`;
            await copiarTexto(texto, 'Todo copiado');
        }
    </script>
</body>
